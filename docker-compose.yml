services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file: ./server/.env
    volumes:
      - ./server:/usr/src/app         # Live sync for backend
      - /usr/src/app/node_modules     # Don't overwrite container modules
    # This command tells the backend to watch for changes and restart automatically
    command: npx nodemon server.js
    networks:
      - peersync-network
    depends_on:
      - piston

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    volumes:
      - ./client:/usr/src/app         # Live sync for frontend
      - /usr/src/app/node_modules     # Don't overwrite container modules
    networks:
      - peersync-network

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_api
    restart: always
    privileged: true
    environment:
      - PISTON_DISABLE_LIMITS=true
      - PISTON_RUN_TIMEOUT=20000
      - PISTON_COMPILE_TIMEOUT=20000
    # Add this to ensure the container has full hardware access
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - "2000:2000"
    tmpfs:
      - /tmp
    volumes:
      - piston-data:/piston/packages
    networks:
      peersync-network:
        aliases:
          - piston

networks:
  peersync-network:
    driver: bridge


volumes:
  piston-data: